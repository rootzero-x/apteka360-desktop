[package]
name = "apteka360-desktop"
version = "0.1.0"
description = "Apteka 360 — dorixona tarmog'i boshqaruv tizimi (desktop ilova)"
authors = ["Apteka 360"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "apteka360_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
gethostname = "1"
# Avto-yangilanish: `updater` feature yoqilganda ulanadi (README: "Avto-yangilanish")
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[features]
default = []
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-dialog"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
